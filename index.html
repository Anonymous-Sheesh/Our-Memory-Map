<style>
:root{
  --night:#12060a; --wine:#3d0b14; --garnet:#8c1c2c; --ember:#c2465a;
  --gold:#d4af6a; --gold-hi:#f1d9a0; --candle:#f2e3c4; --muted:#b49a86;
  --line:rgba(212,175,106,.38);
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  --fell:"IM Fell English","Cormorant Garamond",Georgia,serif;
  --body:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--candle);font-family:var(--body);font-size:20px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(90% 55% at 50% -5%,#3f0d18 0%,rgba(63,13,24,0) 70%),
  radial-gradient(80% 45% at 50% 105%,#2b0811 0%,rgba(43,8,17,0) 70%),var(--night)}
#embers{position:fixed;inset:0;z-index:-1;pointer-events:none}
[hidden]{display:none!important}
h1,h2{margin:0;font-family:var(--fell);font-weight:400;color:var(--gold-hi);text-wrap:balance}
h1{font-size:clamp(32px,9vw,44px);line-height:1.08}
h2{font-size:26px;line-height:1.2;margin-bottom:10px}
p{margin:0 0 .75em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:8px}
.center{text-align:center}
.urdu{font-family:var(--urdu);color:var(--gold);font-size:22px;line-height:2.3;margin:0}
.lede{color:var(--muted);font-style:italic;font-size:19px;line-height:1.45}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(var(--safe-top) + 10px) 14px 14px;background:linear-gradient(180deg,var(--night) 62%,rgba(18,6,10,0))}
.keys{display:flex;gap:3px;margin-right:auto}
.keys svg{width:24px;height:24px;color:rgba(212,175,106,.25);transition:color .6s,filter .6s}
.keys svg.on{color:var(--gold-hi);filter:drop-shadow(0 0 5px rgba(241,217,160,.55))}
.presence{display:flex;align-items:center;gap:7px;min-height:38px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(61,11,20,.6);font-size:15px;color:var(--muted);white-space:nowrap;max-width:48vw;overflow:hidden;cursor:pointer}
.presence span:last-child{overflow:hidden;text-overflow:ellipsis}
.presence .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#7a5a4c}
.presence.here{color:var(--candle)}
.presence.here .dot{background:var(--gold-hi);box-shadow:0 0 8px var(--gold-hi)}
.presence.off .dot{background:var(--ember)}
.icon-btn{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:rgba(61,11,20,.6);font-size:18px;line-height:1;cursor:pointer;padding:0;color:var(--gold-hi)}
.icon-btn.pop{animation:pop .45s ease}
@keyframes pop{40%{transform:scale(1.28)}}

main{max-width:560px;margin:0 auto;padding:4px 20px calc(var(--safe-bot) + 60px)}

/* ---------- buttons ---------- */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 28px;border:0;border-radius:999px;font-family:var(--fell);font-size:21px;line-height:1.1;color:#2a0a0f;background:linear-gradient(180deg,var(--gold-hi),var(--gold));box-shadow:inset 0 0 0 1px rgba(255,240,205,.5),0 10px 26px rgba(140,28,44,.45);cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.ghost{background:rgba(61,11,20,.4);color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{color:#f0a3ad}
.btn[disabled]{opacity:.6;cursor:default}
.link{appearance:none;background:none;border:0;padding:10px 2px;min-height:44px;color:var(--gold);font-style:italic;font-size:18px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer}

/* ---------- arches (the signature shape) ---------- */
.a-fill{fill:url(#gArch)}
.a-line{fill:none;stroke:var(--gold);stroke-width:3;transition:stroke .3s}
.a-inner{fill:none;stroke:rgba(212,175,106,.42);stroke-width:1.4;stroke-dasharray:2 6}
.hero{position:relative;width:min(88vw,350px);margin:6px auto 18px}
.hero svg{display:block;width:100%;height:auto}
.hero-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30% 15% 6%}
.hero-in h1{font-size:clamp(38px,11.5vw,52px);line-height:1}
.hero-in .sub{font-style:italic;color:var(--muted);margin:14px 0 0;font-size:18px}
.roles{display:grid;gap:12px;max-width:320px;margin:18px auto 0}
.intro-copy{font-size:21px;max-width:30em;margin-inline:auto}

.chips{display:flex;justify-content:center;gap:10px;margin:16px 0 20px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1px dashed rgba(212,175,106,.35);color:var(--muted);font-size:17px;transition:all .3s}
.chip.on{border-style:solid;border-color:var(--gold);color:var(--gold-hi);background:rgba(212,175,106,.12)}
.chip.on::after{content:"✓"}

/* ---------- map ---------- */
.map-head{margin-top:4px}
.map-head .lede{min-height:2.9em;margin-top:8px}
.doors{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:26px 18px;margin-top:10px}
.door-tile{position:relative;display:block;width:100%;appearance:none;background:none;border:0;padding:0;cursor:pointer;text-align:center;transition:transform .2s;-webkit-user-select:none;user-select:none}
.door-tile:active{transform:scale(.97)}
.door-tile[disabled]{cursor:default}
.arch{display:block;width:100%;height:auto;overflow:visible}
.tile-in{position:absolute;left:0;top:0;width:100%;aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;padding:36% 10% 12%;pointer-events:none}
.tile-num{font-family:var(--fell);font-size:26px;color:var(--gold-hi);line-height:1}
.tile-icon{margin-top:14px;color:var(--gold);line-height:0}
.tile-icon svg{width:42px;height:42px}
.votes{margin-top:auto;display:flex;flex-direction:column;gap:5px;align-items:center}
.vchip{font-size:14px;line-height:1;padding:5px 10px;border-radius:999px;background:rgba(18,6,10,.75);border:1px solid var(--gold);color:var(--gold-hi)}
.tile-title{display:block;margin-top:10px;font-family:var(--fell);font-size:20px;line-height:1.15;color:var(--candle)}
.tile-state{display:block;font-style:italic;font-size:15px;color:var(--muted);margin-top:3px}
.door-tile.mine .a-line{stroke:var(--gold-hi);filter:drop-shadow(0 0 8px rgba(241,217,160,.75))}
.door-tile.theirs .a-inner{stroke:var(--ember);stroke-dasharray:none;stroke-width:2}
.door-tile.done .a-fill{fill:url(#gLit)}
.door-tile.done .tile-num,.door-tile.done .tile-icon{color:#3d0b14}
.door-tile.done .tile-state{color:var(--gold)}
.vault-call{margin:6px 0 24px;padding:18px;border:1px solid var(--gold);border-radius:16px;background:radial-gradient(circle at 50% 0%,rgba(212,175,106,.18),rgba(61,11,20,.4))}
.vault-call p{font-size:20px}

/* ---------- door ---------- */
.door-nav{display:flex;justify-content:flex-start;margin-top:-6px}
.door-head{text-align:center;margin:0 0 4px}
.door-head .num{display:block;font-family:var(--fell);color:var(--gold);font-size:24px;line-height:1.2}
.photos{display:grid;gap:16px;margin:20px auto 26px;max-width:320px}
.photos.n2{grid-template-columns:1fr 1fr;max-width:440px}
.photo{margin:0}
.photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:50% 50% 6px 6px/24% 24% 6px 6px;box-shadow:0 0 0 1px var(--gold),0 0 0 5px var(--night),0 0 0 6px rgba(212,175,106,.35),0 18px 40px rgba(0,0,0,.55);background:var(--wine)}
.photo figcaption{margin-top:12px;text-align:center;font-style:italic;font-size:16px;color:var(--muted);line-height:1.3}
.scene p{font-size:21px;line-height:1.7}
.scene p:first-child::first-letter{font-family:var(--fell);float:left;font-size:3.2em;line-height:.85;padding:.06em .1em 0 0;color:var(--gold-hi)}
.slip{position:relative;margin-top:28px;padding:22px 20px 18px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,rgba(74,15,26,.62),rgba(26,6,9,.78));scroll-margin-top:90px}
.slip::before{content:"";position:absolute;inset:5px;border:1px solid rgba(212,175,106,.13);border-radius:5px;pointer-events:none}
.clue{font-size:22px;font-style:italic;line-height:1.5;margin-bottom:.5em}
.note{font-size:16px;color:var(--muted);line-height:1.45}
.guess{display:flex;gap:8px;margin:16px 0 4px}
.guess input{flex:1;min-width:0;min-height:52px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(18,6,10,.8);color:var(--candle);font:20px var(--body)}
.guess input::placeholder{color:#8a7264}
.guess input:focus{outline:none;border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(241,217,160,.18)}
.guess .btn{padding:10px 20px;font-size:19px}
.typing{min-height:1.5em;font-size:16px;color:var(--gold);font-style:italic;margin:6px 0 0}
.hint{font-size:19px;color:var(--gold-hi);margin:6px 0 0}
.solved{font-family:var(--fell);color:var(--gold-hi);font-size:22px;margin:6px 0 0}
.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.twin-q{font-size:22px;line-height:1.4;margin:6px 0 4px}
.options{display:grid;gap:10px;margin:12px 0}
.opt{appearance:none;text-align:left;font-size:19px;line-height:1.3;color:var(--candle);background:rgba(18,6,10,.6);border:1px solid var(--line);border-radius:12px;padding:13px 16px;min-height:52px;cursor:pointer;transition:all .2s}
.opt.sel{border-color:var(--gold-hi);background:rgba(212,175,106,.16);box-shadow:inset 0 0 0 1px var(--gold-hi)}
.opt:disabled{cursor:default}
.opt:disabled:not(.sel){opacity:.45}
.status{font-size:17px;font-style:italic;color:var(--muted);min-height:1.5em;margin:4px 0 0}
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;perspective:600px}
.reveal div{padding:12px 10px;border:1px solid var(--gold);border-radius:10px;text-align:center;background:rgba(18,6,10,.6);animation:flip .7s ease both}
.reveal div:nth-child(2){animation-delay:.25s}
.reveal .who{display:block;font-family:var(--fell);color:var(--gold);font-size:18px}
.reveal .ans{display:block;font-size:19px;line-height:1.3;margin-top:4px}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.verdict{text-align:center;font-family:var(--fell);font-size:21px;color:var(--gold-hi);line-height:1.3}
.claim{display:flex;justify-content:center;margin-top:10px}

/* ---------- vault ---------- */
.vault{position:relative;width:min(80vw,310px);aspect-ratio:1;margin:24px auto 14px}
.vault svg{display:block;width:100%;height:100%}
.v-rim{fill:none;stroke:var(--gold);stroke-width:3}
.v-rim2{fill:#1c070c;stroke:rgba(212,175,106,.45);stroke-width:1}
.v-plate{fill:#14050a;stroke:var(--gold);stroke-width:1.5}
.v-hole{fill:#0c0306;stroke:var(--gold);stroke-width:1.5}
.v-key{color:var(--gold-hi)}
.v-track{fill:none;stroke:rgba(212,175,106,.18);stroke-width:5}
.v-ring{fill:none;stroke:var(--gold-hi);stroke-width:5;stroke-linecap:round;stroke-dasharray:465;stroke-dashoffset:465;filter:drop-shadow(0 0 6px rgba(241,217,160,.7))}
.hold-heart{position:absolute;left:50%;top:50%;width:38%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#d04f64,#5c0f1b 72%);box-shadow:0 0 0 2px var(--gold),0 0 34px rgba(194,70,90,.55);color:var(--gold-hi);cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .2s}
.hold-heart svg{width:46%;height:46%;pointer-events:none}
.hold-heart.pressed{transform:translate(-50%,-50%) scale(.93)}

/* ---------- letter + hug ---------- */
.letter{margin-top:6px;padding:26px 22px 20px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,rgba(242,227,196,.06),rgba(242,227,196,.02))}
.letter p{font-size:21px;line-height:1.75}
.greet{font-family:var(--script);font-size:38px!important;line-height:1.2!important;color:var(--gold-hi)}
.signoff{text-align:right;font-style:italic;margin-bottom:0}
.sig{font-family:var(--script);font-size:50px!important;line-height:1.1!important;color:var(--gold-hi);text-align:right;margin:0}
.stats{margin-top:24px;font-style:italic;color:var(--muted);font-size:18px}
.hug{margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
.hug-heart{display:block;width:min(76vw,300px);margin:8px auto 0;padding:0;border:0;background:none;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hug-heart svg{display:block;width:100%;height:auto;overflow:visible;pointer-events:none}
.half{transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.half-l{transform:translateX(-30px)}
.half-r{transform:translateX(30px)}
.half.held{transform:translateX(0)}

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
"use strict";
(function(){
const CONFIG = window.CONFIG;

/* ---------------- helpers ---------------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const now = () => Date.now();
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const vibrate = p => { try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} };
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const photoSrc = k => (window.PHOTOS && window.PHOTOS[k]) || k;

/* ---------------- identity ---------------- */
const qs = new URLSearchParams(location.search);
const ROOM = ((qs.get("room") || CONFIG.room).replace(/[^\w-]/g, "").slice(0, 64)) || CONFIG.room;
const BASE = "ourmemorymap/v1/" + ROOM;
const K = { prog: `omm:${ROOM}:progress`, role: `omm:${ROOM}:role`, solo: `omm:${ROOM}:solo`, mine: r => `omm:${ROOM}:mine:${r}` };
const CID = Math.random().toString(36).slice(2, 10);
const NAMES = { r: CONFIG.her, i: CONFIG.him };
const H = esc(CONFIG.her), I = esc(CONFIG.him);
const other = r => r === "r" ? "i" : "r";

let me = null;
const asP = (qs.get("as") || "").toLowerCase();
if(["rameen","r","her",CONFIG.her.toLowerCase()].includes(asP)) me = "r";
else if(["ibad","i","him",CONFIG.him.toLowerCase()].includes(asP)) me = "i";
if(me) store.set(K.role, me);
else { const s = store.get(K.role); if(s === "r" || s === "i") me = s; }
let solo = qs.get("solo") === "1" ? true : store.get(K.solo) === true;

const pn = () => NAMES[other(me)];
const pet = () => CONFIG.petNames[Math.floor(Math.random() * CONFIG.petNames.length)];
const addr = () => me === "r" ? ", " + pet() : "";
const himHer = () => me === "r" ? "him" : "her";
const heShe = () => me === "r" ? "he" : "she";

/* ---------------- shared progress (synced, retained) ---------------- */
const SCREENS = ["intro","map","door","vault","letter"];
function sanitizeP(o){
  if(!o || typeof o !== "object") return null;
  const arr = a => Array.isArray(a) && a.length === 4 ? a.map(x => x ? 1 : 0) : [0,0,0,0];
  const p = {
    v: Math.max(0, +o.v | 0),
    epoch: Math.max(1, +o.epoch | 0),
    round: Math.max(0, +o.round | 0),
    screen: SCREENS.includes(o.screen) ? o.screen : "intro",
    door: [0,1,2,3].includes(o.door) ? o.door : null,
    stage: o.stage === "twin" ? "twin" : "riddle",
    keys: arr(o.keys),
    hint: arr(o.hint),
    hugs: Math.max(0, +o.hugs | 0)
  };
  if(p.screen === "door" && p.door === null) p.screen = "map";
  if(p.screen !== "door"){ p.door = null; p.stage = "riddle"; }
  return p;
}
let P = sanitizeP(store.get(K.prog) || {});
const body = p => JSON.stringify(Object.assign({}, p, { v: 0 }));
const saveP = () => store.set(K.prog, P);

function newer(a, b){
  if(a.epoch !== b.epoch) return a.epoch > b.epoch;
  if(a.v !== b.v) return a.v > b.v;
  return body(a) > body(b);
}
function merge(w, l){
  const m = clone(w);
  if(w.epoch !== l.epoch) return m;
  for(let k = 0; k < 4; k++){ m.keys[k] = Math.max(w.keys[k], l.keys[k]); m.hint[k] = Math.max(w.hint[k], l.hint[k]); }
  m.hugs = Math.max(w.hugs, l.hugs);
  if(w.screen === "door" && l.screen === "door" && w.door === l.door && w.round === l.round && l.stage === "twin") m.stage = "twin";
  return m;
}
function commit(mut){
  const prev = P;
  const np = clone(P); mut(np);
  const s = sanitizeP(np);
  if(body(s) === body(prev)) return;
  s.v = prev.v + 1;
  P = s; saveP(); publishProgress(); onProgress(prev);
}
let gotProg = false;
function receiveProgress(raw){
  const np = sanitizeP(raw); if(!np) return;
  gotProg = true;
  if(np.epoch < P.epoch) return;
  const prev = P;
  if(np.epoch > P.epoch){ P = np; saveP(); onProgress(prev); return; }
  const pair = newer(np, P) ? [np, P] : [P, np];
  const m = merge(pair[0], pair[1]);
  if(body(m) === body(np)){
    m.v = Math.max(np.v, P.v);
    if(body(m) === body(P)){ if(m.v !== P.v){ P.v = m.v; saveP(); } return; }
    P = m; saveP(); onProgress(prev); return;
  }
  m.v = Math.max(np.v, P.v) + 1;
  const changed = body(m) !== body(P);
  P = m; saveP(); publishProgress();
  if(changed) onProgress(prev);
}

/* ---------------- per-player state (each phone owns its own) ---------------- */
const freshMine = () => ({ epoch: P.epoch, vote: null, twins: {} });
function sanitizeMine(o){
  if(!o || typeof o !== "object") return freshMine();
  let vote = null;
  if(o.vote && typeof o.vote === "object"){
    const val = o.vote.value === "ready" ? "ready" : ([0,1,2,3].includes(o.vote.value) ? o.vote.value : null);
    if(val !== null) vote = { round: +o.vote.round | 0, value: val };
  }
  const twins = {};
  if(o.twins && typeof o.twins === "object") for(const k of ["0","1","2","3"]) if([0,1,2,3].includes(o.twins[k])) twins[k] = o.twins[k];
  return { epoch: +o.epoch | 0, vote, twins };
}
let mine = freshMine(), mineFromStorage = false, mineAdopted = false, partnerState = null;
function loadMine(){
  const s = store.get(K.mine(me));
  mineFromStorage = !!s; mineAdopted = false;
  mine = s ? sanitizeMine(s) : freshMine();
  if(mine.epoch !== P.epoch) mine = freshMine();
}
function partner(){
  if(solo){
    const twins = {};
    for(const k in mine.twins) twins[k] = me === "r" ? CONFIG.doors[k].ibadAnswer : mine.twins[k];
    return { epoch: P.epoch, vote: mine.vote, twins };
  }
  if(partnerState && partnerState.epoch === P.epoch) return partnerState;
  return { epoch: P.epoch, vote: null, twins: {} };
}
const stateOf = r => r === me ? mine : partner();
const voteVal = s => s && s.vote && s.vote.round === P.round ? s.vote.value : null;
function updateMine(mut){
  mut(mine); mine.epoch = P.epoch;
  store.set(K.mine(me), mine); publishMine();
  resolve(); update();
}

/* ---------------- sync transport (MQTT over secure websockets) ---------------- */
let client = null, conn = "idle", brokerIdx = 0, failTimer = null, lastHeard = 0;
function setConn(s){ conn = s; updateHeader(); }
function publishProgress(){
  if(solo || !client || !client.connected) return;
  client.publish(BASE + "/s", JSON.stringify(P), { qos: 1, retain: true });
}
function publishMine(){
  if(solo || !client || !client.connected || !me) return;
  client.publish(`${BASE}/p/${me}`, JSON.stringify(Object.assign({ cid: CID }, mine)), { qos: 1, retain: true });
}
function sendEvent(e){
  if(solo || !client || !client.connected || !me) return;
  client.publish(BASE + "/e", JSON.stringify(Object.assign({ cid: CID, from: me }, e)), { qos: 0 });
}
function connect(){
  disconnect();
  if(!me) return;
  if(solo){ setConn("solo"); return; }
  const lib = window.mqtt;
  const fn = lib && (lib.connect || (lib.default && lib.default.connect));
  if(!fn){ setConn("nolib"); return; }
  tryBroker(fn, brokerIdx);
}
function tryBroker(fn, i){
  brokerIdx = i % CONFIG.brokers.length;
  setConn("connecting");
  let c;
  try{
    c = fn(CONFIG.brokers[brokerIdx], { clientId: "omm_" + CID + "_" + Math.random().toString(36).slice(2, 6), clean: true, keepalive: 30, connectTimeout: 8000, reconnectPeriod: 2500, protocolVersion: 4 });
  }catch(e){ setTimeout(() => tryBroker(fn, i + 1), 1500); return; }
  client = c;
  let ever = false;
  clearTimeout(failTimer);
  failTimer = setTimeout(() => {
    if(!ever && client === c){ try{ c.end(true); }catch(e){} client = null; tryBroker(fn, i + 1); }
  }, 10000);
  c.on("connect", () => {
    if(client !== c) return;
    ever = true; clearTimeout(failTimer); gotProg = false;
    setConn("online");
    c.subscribe(BASE + "/#", { qos: 1 }, () => {
      publishMine(); sendEvent({ type: "hello" });
      setTimeout(() => { if(client === c && !gotProg && P.v > 0) publishProgress(); }, 1800);
    });
  });
  c.on("message", (t, p) => { if(client === c) onMessage(t, p); });
  c.on("reconnect", () => { if(client === c) setConn("connecting"); });
  c.on("offline", () => { if(client === c) setConn("offline"); });
  c.on("close", () => { if(client === c && conn === "online") setConn("offline"); });
  c.on("error", () => {});
}
function disconnect(){
  clearTimeout(failTimer);
  if(client){ const c = client; client = null; try{ c.end(true); }catch(e){} }
}
function onMessage(topic, payload){
  let data;
  try{ data = JSON.parse(typeof payload === "string" ? payload : new TextDecoder().decode(payload)); }catch(e){ return; }
  if(!me || !data) return;
  const sub = topic.slice(BASE.length + 1);
  if(sub === "s") receiveProgress(data);
  else if(sub === "p/r" || sub === "p/i"){
    if(data.cid === CID) return;
    const who = sub.slice(2), st = sanitizeMine(data);
    if(who === me){
      if(!mineFromStorage && !mineAdopted && st.epoch >= mine.epoch){ mine = st; mineAdopted = true; store.set(K.mine(me), mine); publishMine(); }
    } else partnerState = st;
    resolve(); update();
  }
  else if(sub === "e") onEvent(data);
}
function partnerOnline(){ return solo || now() - lastHeard < 11000; }
function heard(){
  const was = partnerOnline();
  lastHeard = now();
  if(!was){ updateHeader(); update(); resolve(); }
}

/* ---------------- live events ---------------- */
let partnerHold = { what: null, until: 0 };
function onEvent(e){
  if(!e || e.cid === CID || (e.from !== "r" && e.from !== "i") || e.from === me) return;
  heard();
  switch(e.type){
    case "hello": sendEvent({ type: "ping" }); publishMine(); break;
    case "kiss": receiveKiss(); break;
    case "hold":
      if(e.on) partnerHold = { what: e.what, until: now() + 2600 };
      else if(partnerHold.what === e.what) partnerHold.until = 0;
      break;
    case "typing": showTyping(e); break;
    case "guess": partnerGuess(e); break;
  }
}

/* ---------------- game rules ---------------- */
function resolve(){
  if(!me) return;
  const a = voteVal(mine), b = voteVal(partner());
  if(P.screen === "intro"){
    if(a === "ready" && b === "ready") commit(p => { if(p.screen === "intro"){ p.screen = "map"; p.round = 1; } });
  } else if(P.screen === "map"){
    if(typeof a === "number" && a === b && !P.keys[a]) commit(p => { if(p.screen === "map"){ p.screen = "door"; p.door = a; p.stage = "riddle"; } });
  }
}
function norm(s){
  return String(s).toLowerCase().normalize("NFKC").replace(/[^\p{L}\s]/gu, " ").replace(/(\p{L})\1+/gu, "$1").replace(/\s+/g, " ").trim();
}
function matches(guess, answers){
  const g = norm(guess); if(!g) return false;
  const joined = g.replace(/ /g, ""), tokens = g.split(" ");
  return answers.some(a => { const n = norm(a), nj = n.replace(/ /g, ""); return joined === nj || tokens.includes(nj) || (n.includes(" ") && g.includes(n)); });
}

let booted = false, justOpened = false, scrollTwin = false;
function onProgress(prev){
  if(prev.epoch !== P.epoch && mine.epoch !== P.epoch){ mine = freshMine(); store.set(K.mine(me), mine); publishMine(); }
  if(prev.screen !== P.screen || prev.door !== P.door) endHold();
  const opened = prev.screen === "vault" && P.screen === "letter";
  if(prev.epoch === P.epoch && P.screen === "door" && prev.screen === "door" && prev.door === P.door && prev.stage !== "twin" && P.stage === "twin") scrollTwin = true;
  justOpened = opened && booted;
  render();
  justOpened = false;
  if(opened && booted) playVaultOpen();
  if(prev.epoch === P.epoch && booted){
    const gained = P.keys.map((k, i) => k && !prev.keys[i] ? i : -1).filter(i => i >= 0);
    if(gained.length === 1) showKeyOverlay(gained[0]);
    if(P.hugs > prev.hugs) toast(`That’s hug number ${P.hugs} tonight 🫂`);
  }
  resolve();
}

/* ---------------- shapes ---------------- */
const ARCH = "M12 296V128C12 80 56 62 80 42C92 32 98 20 100 8C102 20 108 32 120 42C144 62 188 80 188 128V296Z";
const HERO = "M16 296V156C16 96 82 74 114 48C132 34 145 20 150 6C155 20 168 34 186 48C218 74 284 96 284 156V296Z";
const KEY_PATHS = '<circle cx="20" cy="32" r="11" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="20" cy="32" r="3" fill="currentColor"/><path d="M31 32H58M49 32v9M56 32v7" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>';
const KEY_SVG = `<svg viewBox="0 0 64 64" aria-hidden="true">${KEY_PATHS}</svg>`;
const ICONS = {
  bubble: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h30a5 5 0 0 1 5 5v15a5 5 0 0 1-5 5H21l-9 7v-7H9a5 5 0 0 1-5-5V14a5 5 0 0 1 5-5z"/><path d="M24 28s-6-3.6-6-7.4c0-2 1.5-3.4 3.2-3.4 1.3 0 2.2.7 2.8 1.7.6-1 1.5-1.7 2.8-1.7 1.7 0 3.2 1.4 3.2 3.4 0 3.8-6 7.4-6 7.4z"/></svg>',
  moon: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M29 6A18 18 0 1 0 42 34 15 15 0 0 1 29 6z"/><path d="M38 9l1.2 2.8L42 13l-2.8 1.2L38 17l-1.2-2.8L34 13l2.8-1.2z"/></svg>',
  block: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M24 5l17 9v20l-17 9-17-9V14z"/><path d="M7 14l17 9 17-9M24 23v20"/></svg>',
  cap: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 19l20-9 20 9-20 9z"/><path d="M12 23v9c0 3.5 5.4 6 12 6s12-2.5 12-6v-9"/><path d="M40 21v11"/></svg>'
};
const HEART_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.4-4.5-9.9-9.2C.4 8.5 2.4 4.6 6 4.6c2.3 0 3.8 1.3 6 3.6 2.2-2.3 3.7-3.6 6-3.6 3.6 0 5.6 3.9 3.9 7.2C19.4 16.5 12 21 12 21z"/></svg>';
const HEARTP = "M120 186C62 146 22 114 22 72C22 42 44 20 72 20C94 20 110 33 120 52C130 33 146 20 168 20C196 20 218 42 218 72C218 114 178 146 120 186Z";
const HUG_SVG = `<svg viewBox="-20 0 280 200" aria-hidden="true">
  <g class="half half-l" id="half-r"><path d="${HEARTP}" clip-path="url(#clipL)" fill="url(#gHeart)" stroke="#d4af6a" stroke-width="2.5"/></g>
  <g class="half half-r" id="half-i"><path d="${HEARTP}" clip-path="url(#clipR)" fill="url(#gHeart)" stroke="#d4af6a" stroke-width="2.5"/></g>
</svg>`;
function vaultSVG(withRing){

/* ---------------- hold-together mechanic ---------------- */
const VAULT_MS = 2200;
let localHold = null, holdRepeat = null, bothSince = 0, lastBuzz = 0, lastWhat = null;
function partnerHolding(what){
  if(solo) return localHold === what;
  return partnerHold.what === what && now() < partnerHold.until && partnerOnline();
}
function startHold(what){
  if(localHold === what) return;
  localHold = what;
  sendEvent({ type: "hold", what, on: true });
  clearInterval(holdRepeat);
  holdRepeat = setInterval(() => sendEvent({ type: "hold", what, on: true }), 900);
  tick();
}
function endHold(){
  if(!localHold) return;
  const w = localHold; localHold = null;
  clearInterval(holdRepeat);
  sendEvent({ type: "hold", what: w, on: false });
  tick();
}
function bindHold(el, what){
  if(!el) return;
  el.addEventListener("pointerdown", e => { e.preventDefault(); try{ el.setPointerCapture(e.pointerId); }catch(x){} startHold(what); });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(t => el.addEventListener(t, endHold));
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("keydown", e => { if((e.key === " " || e.key === "Enter") && !e.repeat){ e.preventDefault(); startHold(what); } });
  el.addEventListener("keyup", e => { if(e.key === " " || e.key === "Enter") endHold(); });
  el.addEventListener("blur", endHold);
}
function tick(){
  const t = now();
  const what = P.screen === "vault" ? "vault" : P.screen === "letter" ? "hug" : null;
  if(what !== lastWhat){ lastWhat = what; bothSince = 0; }
  if(!what || !me){ bothSince = 0; return; }
  const mH = localHold === what, tH = partnerHolding(what), both = mH && tH;
  if(both && !bothSince){ bothSince = t; if(what === "hug"){ vibrate([40, 110, 60]); lastBuzz = t; } }
  if(!both && bothSince){ const dur = t - bothSince; bothSince = 0; if(what === "hug") hugEnded(dur); }
  const el = both ? t - bothSince : 0;
  const rH = me === "r" ? mH : tH, iH = me === "i" ? mH : tH;
  if(what === "vault"){
    const ring = $("#ring"); if(!ring) return;
    ring.style.strokeDashoffset = String(464.96 * (1 - Math.min(1, el / VAULT_MS)));
    $("#hold-r").classList.toggle("on", rH); $("#hold-i").classList.toggle("on", iH);
    $("#vaultHeart").classList.toggle("pressed", mH);
    setText("#vaultStatus", both ? "Keep holding…" : mH ? `Holding. Waiting for ${pn()}…` : tH ? `${pn()} is holding. Press the heart.` : "Press and hold the heart, both of you.");
    if(both && el >= VAULT_MS) commit(p => { if(p.screen === "vault" && p.keys.every(Boolean)) p.screen = "letter"; });
  } else {
    const hr = $("#half-r"), hi = $("#half-i"), heart = $("#hugHeart");
    if(!heart) return;
    hr.classList.toggle("held", rH); hi.classList.toggle("held", iH);
    heart.classList.toggle("merged", both);
    setText("#hugStatus", both ? `Hugging for ${Math.floor(el / 1000)}s 🤍` : mH ? `Holding on… waiting for ${pn()}’s arms` : tH ? `${pn()} is already holding on. Hold the heart.` : "");
    if(both && t - lastBuzz > 1300){ vibrate([30, 100, 50]); lastBuzz = t; }
  }
}
function setText(sel, txt){ const e = $(sel); if(e && e.textContent !== txt) e.textContent = txt; }
function hugEnded(dur){
  if(dur < 1500) return;
  if(me === "r" || solo) commit(p => { p.hugs = p.hugs + 1; });
}

/* ---------------- moments ---------------- */
function toast(msg){
  const box = $("#toasts");
  while(box.children.length >= 3) box.firstChild.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => t.classList.add("out"), 3400);
  setTimeout(() => t.remove(), 3900);
}
function floatBurst(chars, n){
  if(reduceMotion) return;
  for(let k = 0; k < n; k++){
    const s = document.createElement("span");
    s.className = "floaty"; s.textContent = chars[k % chars.length];
    s.style.left = (6 + Math.random() * 86) + "vw";
    s.style.fontSize = (22 + Math.random() * 18) + "px";
    s.style.animationDelay = (Math.random() * .7) + "s";
    s.style.setProperty("--r", (Math.random() * 60 - 30) + "deg");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 3800);
  }
}

    sendEvent({ type: "kiss" }); toast("Kiss sent 💋");
  },
  menu(){ openMenu(); },
  closeMenu(){ $("#menu").hidden = true; },
  reconnect(){ $("#menu").hidden = true; brokerIdx = 0; connect(); },
  switchPlayer(){ $("#menu").hidden = true; disconnect(); endHold(); me = null; store.del(K.role); render(true); },
  reset(){
    if(!confirm("Start the whole map over? This clears every key for both of you.")) return;
    $("#menu").hidden = true;
    const prev = P;
    P = sanitizeP({ epoch: P.epoch + 1 }); P.v = 1;
    saveP(); publishProgress(); onProgress(prev);
    render(true);
  }
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-door],[data-opt],[data-role]");
  if(!t){ if(e.target.id === "menu") $("#menu").hidden = true; return; }
  if(t.dataset.role){ me = t.dataset.role; store.set(K.role, me); start(); return; }
  if(t.dataset.door != null){
    const i = +t.dataset.door;
    if(P.screen === "map" && !P.keys[i]) updateMine(m => { m.vote = { round: P.round, value: i }; });
    return;
  }
  if(t.dataset.opt != null){
    const i = P.door, k = +t.dataset.opt;
    if(P.screen !== "door" || P.stage !== "twin") return;
    if(mine.twins[i] != null && partner().twins[i] != null) return;
    updateMine(m => { m.twins[i] = k; });
    return;
  }
  const a = ACTIONS[t.dataset.act]; if(a) a();
});
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ endHold(); return; }
  if(!me || solo) return;
  if(client && !client.connected){ try{ client.reconnect(); }catch(e){} }
  else sendEvent({ type: "hello" });
});

/* ---------------- candle embers (quiet background) ---------------- */
(function embers(){
  if(reduceMotion) return;
  const c = $("#embers"), ctx = c && c.getContext ? c.getContext("2d") : null;
  if(!ctx || !window.requestAnimationFrame) return;
  let w, h, dpr; const ps = [];
  function size(){ dpr = Math.min(2, window.devicePixelRatio || 1); w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr; c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px"; }
  function spawn(init){ return { x: Math.random() * w, y: init ? Math.random() * h : h + 10, r: (Math.random() * 1.5 + .5) * dpr, vy: (Math.random() * .22 + .06) * dpr, vx: (Math.random() - .5) * .12 * dpr, a: Math.random() * .45 + .15, t: Math.random() * 6.28 }; }
  size(); addEventListener("resize", size);
  for(let k = 0; k < 16; k++) ps.push(spawn(true));
  (function frame(){
    if(!document.hidden){
      ctx.clearRect(0, 0, w, h);
      for(const p of ps){
        p.t += .01; p.y -= p.vy; p.x += p.vx + Math.sin(p.t) * .1 * dpr;
        if(p.y < -10) Object.assign(p, spawn(false));
        ctx.beginPath();
        ctx.fillStyle = `rgba(241,200,130,${p.a * (.6 + .4 * Math.sin(p.t * 3))})`;
        ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
    }
    requestAnimationFrame(frame);
  })();
})();

/* ---------------- boot ---------------- */
function start(){
  booted = false;
  loadMine();
  render(true);
  connect();
  setTimeout(() => { booted = true; }, 2500);
}
setInterval(tick, 100);
setInterval(() => { if(me && !solo) sendEvent({ type: "ping" }); }, 4000);
setInterval(() => { if(!me) return; updateHeader(); if(P.screen === "intro") updIntro(); else if(P.screen === "map") updMap(); }, 2000);
window.addEventListener("DOMContentLoaded", () => { if(me) start(); else render(true); });
})();
